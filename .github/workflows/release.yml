name: Release Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-build:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Mise (Tuist & Swift)
        uses: jdx/mise-action@v2

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.0.app

      - name: Configure Dynamic Linker Paths
        run: |
          XCODE_PATH=$(xcode-select -p)
          SWIFT_LIB_PATH=$(find "$XCODE_PATH/Toolchains/XcodeDefault.xctoolchain/usr/lib" -name "libswiftCompatibilitySpan.dylib" | grep "/macosx/" | head -n 1 | xargs dirname)
          if [ -n "$SWIFT_LIB_PATH" ]; then
            echo "DYLD_FALLBACK_LIBRARY_PATH=$SWIFT_LIB_PATH:$DYLD_FALLBACK_LIBRARY_PATH" >> $GITHUB_ENV
            echo "Configured DYLD_FALLBACK_LIBRARY_PATH to: $SWIFT_LIB_PATH"
          else
            echo "libswiftCompatibilitySpan.dylib not found in active macOS toolchain"
          fi

      - name: Fix Xcode Package Fingerprint Plugins Validation
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Install dependencies via Tuist
        run: tuist install

      - name: Generate Xcode Project
        run: tuist generate --no-open

      - name: Build Self-Compiled App (Free version)
        run: |
          xcodebuild build \
            -workspace Cork.xcworkspace \
            -scheme Self-Compiled \
            -configuration Release \
            -derivedDataPath build_self_compiled \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build Cork App (Paid version)
        run: |
          xcodebuild build \
            -workspace Cork.xcworkspace \
            -scheme Cork \
            -configuration Release \
            -derivedDataPath build_cork \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Self-Compiled App
        run: |
          APP_PATH=$(find build_self_compiled -name "Cork.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "${{ github.workspace }}/Cork-Self-Compiled.zip" Cork.app
          else
            echo "Self-Compiled Cork.app not found!"
            exit 1
          fi

      - name: Package Cork App
        run: |
          APP_PATH=$(find build_cork -name "Cork.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "${{ github.workspace }}/Cork.zip" Cork.app
          else
            echo "Cork.app not found!"
            exit 1
          fi

      - name: Upload Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cork-Self-Compiled.zip
            Cork.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
